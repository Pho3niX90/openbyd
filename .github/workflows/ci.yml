name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Whether the surface audit fails (test_surface.py) when a pyBYD symbol has
  # no parity call. "0" while the port is in progress: the gap is reported and
  # the test skips. Switch to "1" once the port is complete.
  OPENBYD_SURFACE_STRICT: "1"

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --exclude openbyd-py --all-features

  coverage:
    name: Rust coverage (at least 90% of lines)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Run the tests with coverage
        run: cargo llvm-cov --workspace --exclude openbyd-py --all-features --no-report
      - name: Write the lcov file
        run: cargo llvm-cov report --lcov --output-path lcov.info
      - name: Per-file summary, and the 90% gate
        run: cargo llvm-cov report --summary-only --fail-under-lines 90
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: rust-lcov
          path: lcov.info
          if-no-files-found: warn

  parity:
    name: Parity with pyBYD
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            parity/UPSTREAM_COMMIT
            parity/UPSTREAM_REPO
      - name: Install openbyd and the pinned pyBYD
        run: |
          python -m pip install --upgrade pip
          # SQLAlchemy is only for the tests of the replay exporter's database statements.
          pip install maturin pytest pytest-cov pytest-asyncio sqlalchemy "pybyd @ git+$(cat parity/UPSTREAM_REPO)@$(cat parity/UPSTREAM_COMMIT)"
          # Built with the `testing` feature, so the tests that need the fake
          # BYD server run here. Released wheels are built without it.
          python parity/dev_install.py
      - name: Recorded vectors are what pyBYD answers
        run: python parity/generate.py --check
      - name: Surface audit report
        run: |
          python parity/surface.py
          echo "OPENBYD_SURFACE_STRICT=$OPENBYD_SURFACE_STRICT"
          pytest python/tests/test_surface.py -v -rs
      - name: Tests, with coverage of python/openbyd (at least 90% of lines)
        run: pytest -v --cov --cov-report=term-missing --cov-report=xml:coverage.xml
      - name: Random comparison with a fresh seed
        env:
          OPENBYD_FUZZ: "2000"
          OPENBYD_PARITY_SEED: ${{ github.run_id }}
        run: |
          echo "Seed: $OPENBYD_PARITY_SEED, cases per group: $OPENBYD_FUZZ"
          echo "To reproduce: OPENBYD_FUZZ=$OPENBYD_FUZZ OPENBYD_PARITY_SEED=$OPENBYD_PARITY_SEED pytest python/tests/test_parity.py"
          pytest -v python/tests/test_parity.py
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: python-coverage
          path: coverage.xml
          if-no-files-found: ignore

  oldest-python:
    # The extension is one abi3 wheel for Python 3.11 and later, and 3.11
    # differs where it matters to the bindings: its garbage collector runs
    # inside an allocation, which later versions defer.
    name: Tests on Python 3.11
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            parity/UPSTREAM_COMMIT
            parity/UPSTREAM_REPO
      - name: Install openbyd and the pinned pyBYD
        run: |
          python -m pip install --upgrade pip
          pip install maturin pytest pytest-cov pytest-asyncio "pybyd @ git+$(cat parity/UPSTREAM_REPO)@$(cat parity/UPSTREAM_COMMIT)"
          python parity/dev_install.py
      - name: Tests
        run: pytest -v

  wheel:
    name: Linux wheel (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { target: x86_64, manylinux: auto }
          # The TLS library's assembly needs a newer cross compiler than the
          # manylinux2014 image has for ARM.
          - { target: aarch64, manylinux: "2_28" }
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist
      - name: Install the wheel in the image the backend runs on
        if: matrix.target == 'x86_64'
        run: |
          docker run --rm -v "$PWD:/src:ro" python:3.12-slim sh -c '
            pip install --no-cache-dir /src/dist/*.whl pytest &&
            cd /tmp && pytest -q -p no:cacheprovider /src/python/tests/test_vectors.py
          '
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.target }}
          path: dist/*.whl
