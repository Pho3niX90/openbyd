name: Nightly parity

# A long random comparison with the pinned pyBYD, seeded with the date.
# On failure it opens (or comments on) one issue titled "Nightly parity run failed".

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: nightly-parity
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: Random comparison (50000 cases per group)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      OPENBYD_FUZZ: "50000"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            parity/UPSTREAM_COMMIT
            parity/UPSTREAM_REPO
      - name: Install openbyd and the pinned pyBYD
        run: |
          python -m pip install --upgrade pip
          pip install . pytest "pybyd @ git+$(cat parity/UPSTREAM_REPO)@$(cat parity/UPSTREAM_COMMIT)"
      - name: Pick the seed
        run: echo "OPENBYD_PARITY_SEED=$(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"
      - name: Random comparison
        timeout-minutes: 150
        run: |
          set -o pipefail
          echo "Seed: $OPENBYD_PARITY_SEED, cases per group: $OPENBYD_FUZZ"
          pytest -v python/tests/test_parity.py 2>&1 | tee "$RUNNER_TEMP/pytest.log"
      - name: Open or update the issue
        if: ${{ failure() }}
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          log="$RUNNER_TEMP/pytest.log"
          [ -f "$log" ] || echo "No test output was captured (the job failed before or while running the tests)." > "$log"
          {
            echo "The nightly random comparison with pyBYD failed."
            echo
            echo "- Seed: \`$OPENBYD_PARITY_SEED\`"
            echo "- Cases per group: \`$OPENBYD_FUZZ\`"
            echo "- Pinned pyBYD: \`$(cat parity/UPSTREAM_COMMIT)\` from $(cat parity/UPSTREAM_REPO)"
            echo "- Run: $RUN_URL"
            echo
            echo "Reproduce: \`OPENBYD_FUZZ=$OPENBYD_FUZZ OPENBYD_PARITY_SEED=$OPENBYD_PARITY_SEED pytest python/tests/test_parity.py\`"
            echo
            echo "Last lines of the output:"
            echo
            echo '````'
            tail -n 150 "$log" | tail -c 20000
            echo '````'
          } > "$RUNNER_TEMP/body.md"
          number=$(gh issue list --state open --limit 100 --json number,title \
            --jq '[.[] | select(.title == "Nightly parity run failed")][0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file "$RUNNER_TEMP/body.md"
          else
            gh issue create --title "Nightly parity run failed" --body-file "$RUNNER_TEMP/body.md"
          fi
