name: Upstream watch

# Notices when pyBYD's main branch has moved past the commit in
# parity/UPSTREAM_COMMIT and opens a pull request that moves the pin,
# re-records the vectors and reports what changed. It ports nothing and
# never merges.
#
# While openbyd carries ports of pull requests pyBYD has not merged yet, the
# pin is a merge of pyBYD's main and those pull requests, kept in the fork
# named in parity/UPSTREAM_REPO. Such a pin is current as long as it contains
# pyBYD's main. Once main moves past it, this workflow tries to move the pin
# back to pyBYD's own repository. That works when main now holds everything
# openbyd ported. When a ported pull request is still open, the vectors
# cannot be recorded from main (its parity groups import code main does not
# have), and the run fails saying so: merge main into the fork's
# openbyd-combined branch by hand and move the pin to that merge.
#
# The repository setting "Allow GitHub Actions to create and approve pull
# requests" (Settings > Actions > General) must be on. Pull requests opened
# with GITHUB_TOKEN do not start the CI workflow; push an empty commit to the
# branch, or close and reopen the pull request, to run it.

on:
  schedule:
    - cron: "43 3 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild the branch and pull request even if they are already up to date"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-watch
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  UPSTREAM_REPO: https://github.com/jkaberg/pyBYD
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}

jobs:
  watch:
    name: Follow pyBYD
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Has pyBYD moved?
        id: head
        run: |
          old=$(tr -d '[:space:]' < parity/UPSTREAM_COMMIT)
          new=$(git ls-remote "$UPSTREAM_REPO" refs/heads/main | cut -f1)
          if [ -z "$new" ]; then
            echo "Could not read the head of pyBYD main" >&2
            exit 1
          fi
          branch="upstream/${new:0:12}"
          pin_repo=$(tr -d '[:space:]' < parity/UPSTREAM_REPO)
          echo "pinned: $old ($pin_repo)"
          echo "head:   $new"
          {
            echo "old=$old"
            echo "new=$new"
            echo "short=${new:0:12}"
            echo "branch=$branch"
            echo "pin_repo=$pin_repo"
          } >> "$GITHUB_OUTPUT"
          # A pin kept in a fork (main plus open pull requests) is current
          # while it contains pyBYD's main.
          if [ "$pin_repo" != "$UPSTREAM_REPO" ] && [ "$old" != "$new" ]; then
            git init --quiet "$RUNNER_TEMP/pin"
            if ! git -C "$RUNNER_TEMP/pin" fetch --quiet "$pin_repo" "$old"; then
              echo "::error::The pinned commit $old cannot be fetched from $pin_repo. Was its branch rewritten or deleted?"
              exit 1
            fi
            git -C "$RUNNER_TEMP/pin" fetch --quiet "$UPSTREAM_REPO" "$new"
            if git -C "$RUNNER_TEMP/pin" merge-base --is-ancestor "$new" "$old"; then
              echo "The pin contains pyBYD's main."
              echo "changed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          if [ "$old" = "$new" ]; then
            echo "The pin is current."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Already prepared: the branch exists and has main in its history.
          if git ls-remote --exit-code --heads origin "$branch" > /dev/null 2>&1; then
            git fetch --quiet origin "$branch"
            if git merge-base --is-ancestor origin/main "origin/$branch" && [ "${{ inputs.force }}" != "true" ]; then
              echo "$branch is already up to date with main; nothing to do."
              echo "changed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        if: steps.head.outputs.changed == 'true'
      - uses: Swatinem/rust-cache@v2
        if: steps.head.outputs.changed == 'true'
      - uses: actions/setup-python@v5
        if: steps.head.outputs.changed == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Move the pin and install openbyd and pyBYD at the new commit
        if: steps.head.outputs.changed == 'true'
        env:
          NEW: ${{ steps.head.outputs.new }}
          BRANCH: ${{ steps.head.outputs.branch }}
        run: |
          git switch -C "$BRANCH" origin/main
          echo "$NEW" > parity/UPSTREAM_COMMIT
          echo "$UPSTREAM_REPO" > parity/UPSTREAM_REPO
          python -m pip install --upgrade pip
          pip install . pytest "pybyd @ git+$UPSTREAM_REPO@$NEW"

      - name: Re-record the vectors
        if: steps.head.outputs.changed == 'true'
        env:
          PIN_REPO: ${{ steps.head.outputs.pin_repo }}
        run: |
          if ! python parity/generate.py; then
            if [ "$PIN_REPO" != "$UPSTREAM_REPO" ]; then
              echo "::error::pyBYD's main has moved past the combined pin in $PIN_REPO, and the vectors cannot be recorded from main alone: openbyd probably still has parity groups for a pull request main does not hold. Merge main into the fork's openbyd-combined branch and move the pin to that merge."
            fi
            exit 1
          fi

      - name: Collect the report pieces
        if: steps.head.outputs.changed == 'true'
        env:
          OLD: ${{ steps.head.outputs.old }}
          NEW: ${{ steps.head.outputs.new }}
          PIN_REPO: ${{ steps.head.outputs.pin_repo }}
        run: |
          out="$RUNNER_TEMP/report"
          mkdir -p "$out"

          # What changed upstream. The old pin may live in a fork.
          git clone --quiet "$UPSTREAM_REPO" "$RUNNER_TEMP/pybyd-ref"
          git -C "$RUNNER_TEMP/pybyd-ref" fetch --quiet "$PIN_REPO" "$OLD" 2> /dev/null || true
          if git -C "$RUNNER_TEMP/pybyd-ref" cat-file -e "$OLD^{commit}" 2> /dev/null; then
            git -C "$RUNNER_TEMP/pybyd-ref" log --format='%H%x09%cs%x09%s' "$OLD..$NEW" > "$out/commits.tsv"
            git -C "$RUNNER_TEMP/pybyd-ref" diff --stat=100 "$OLD" "$NEW" > "$out/diffstat.txt"
          else
            echo "The pinned commit is no longer in pyBYD's history." >&2
            : > "$out/commits.tsv"
            echo "(the pinned commit $OLD is no longer in pyBYD's history)" > "$out/diffstat.txt"
          fi

          # What changed in the recorded vectors.
          git add -A -- parity/UPSTREAM_COMMIT parity/UPSTREAM_REPO 'crates/*/tests/vectors'
          git diff --cached --numstat -- 'crates/*/tests/vectors' > "$out/numstat.txt"

          # Strict surface audit: the symbols with no parity call.
          set +e
          OPENBYD_SURFACE_STRICT=1 pytest python/tests/test_surface.py -q --tb=short -p no:cacheprovider \
            > "$out/surface.txt" 2>&1

          # The test suites with the new pin (not strict).
          cargo test --workspace --exclude openbyd-py --all-features > "$out/cargo.txt" 2>&1
          echo $? > "$out/cargo.status"
          pytest -q --tb=short -p no:cacheprovider > "$out/pytest.txt" 2>&1
          echo $? > "$out/pytest.status"
          set -e

          python scripts/upstream_report.py \
            --old "$OLD" --new "$NEW" \
            --commits "$out/commits.tsv" \
            --diffstat "$out/diffstat.txt" \
            --numstat "$out/numstat.txt" \
            --surface "$out/surface.txt" \
            --cargo-log "$out/cargo.txt" --cargo-status "$(cat "$out/cargo.status")" \
            --pytest-log "$out/pytest.txt" --pytest-status "$(cat "$out/pytest.status")" \
            --agents AGENTS.md \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            > "$out/body.md"
          cat "$out/body.md"

      - name: Commit and push the branch
        if: steps.head.outputs.changed == 'true'
        env:
          SHORT: ${{ steps.head.outputs.short }}
          BRANCH: ${{ steps.head.outputs.branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- parity/UPSTREAM_COMMIT parity/UPSTREAM_REPO 'crates/*/tests/vectors'
          git commit -m "Follow pyBYD to $SHORT" -m "Move the pinned pyBYD commit and re-record the vectors. Nothing is ported yet; see the pull request for the report."
          git push --force origin "HEAD:refs/heads/$BRANCH"

      - name: Open or update the pull request, close older ones
        if: steps.head.outputs.changed == 'true'
        env:
          SHORT: ${{ steps.head.outputs.short }}
          BRANCH: ${{ steps.head.outputs.branch }}
        run: |
          title="Follow pyBYD to $SHORT"
          body="$RUNNER_TEMP/report/body.md"
          number=$(gh pr list --state open --head "$BRANCH" --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh pr edit "$number" --title "$title" --body-file "$body"
          else
            gh pr create --base main --head "$BRANCH" --title "$title" --body-file "$body"
            number=$(gh pr list --state open --head "$BRANCH" --json number --jq '.[0].number // empty')
          fi
          echo "Pull request: #$number"
          gh pr list --state open --limit 100 --json number,headRefName \
            --jq ".[] | select(.headRefName | startswith(\"upstream/\")) | select(.headRefName != \"$BRANCH\") | .number" |
          while read -r old; do
            gh pr close "$old" --delete-branch --comment "Superseded by #$number, which follows pyBYD to $SHORT."
          done
