[workspace]
resolver = "3"
members = [
    "crates/openbyd-crypto",
    "crates/openbyd-protocol",
    "crates/openbyd-client",
    "crates/openbyd-cli",
    "crates/openbyd-py",
]

[workspace.package]
version = "0.1.2"
edition = "2024"
license = "MIT"
repository = "https://github.com/Pho3niX90/openbyd"

[workspace.dependencies]
wallclock = { git = "https://github.com/Pho3niX90/wallclock", rev = "eddb12777a94dcc29d961d4ff8be1d151846e154" }
openbyd-crypto = { path = "crates/openbyd-crypto", version = "0.1.2" }
openbyd-protocol = { path = "crates/openbyd-protocol", version = "0.1.2" }
openbyd-client = { path = "crates/openbyd-client", version = "0.1.2" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
