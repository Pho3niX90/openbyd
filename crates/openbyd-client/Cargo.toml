[package]
name = "openbyd-client"
description = "Async client for the BYD overseas app API"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
# The recorded vectors are large and only useful with the parity tooling in the repository.
exclude = ["tests/"]

[dependencies]
log = "0.4"
openbyd-protocol.workspace = true
rumqttc = { version = "0.25.1", default-features = false, features = ["use-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8"
serde_json.workspace = true
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }

[lints]
workspace = true

[dev-dependencies]
bytes = "1"
memory-stats = "1"
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
