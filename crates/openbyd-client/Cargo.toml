[package]
name = "openbyd-client"
description = "Async client for the BYD overseas app API"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
# The recorded vectors are large and only useful with the parity tooling in the repository.
exclude = ["tests/"]

[features]
# The fake BYD server (`openbyd_client::testing`) for tests, bindings and benchmarks.
# Also the TLS MQTT test broker (`openbyd_client::testing::broker`).
testing = [
    "dep:openbyd-crypto",
    "dep:bytes",
    "dep:rcgen",
    "dep:tokio-rustls",
    "hyper/server",
    "tokio/net",
    "tokio/io-util",
]

[dependencies]
openbyd-protocol.workspace = true
openbyd-crypto = { workspace = true, optional = true }
serde_json.workspace = true
log = "0.4"
tokio = { version = "1", default-features = false, features = ["rt", "time", "sync", "macros"] }
# TLS for both HTTP and MQTT: rustls on ring, so every target builds without OpenSSL, cmake or NASM.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
# HTTP environment (`http.rs`): hyper's HTTP/1.1 client with bundled web-PKI roots.
getrandom = "0.2"
http-body-util = "0.1"
httpdate = "1"
hyper = { version = "1", default-features = false, features = ["client", "http1"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "tls12", "ring", "webpki-roots"] }
hyper-util = { version = "0.1", default-features = false, features = ["client-legacy", "http1", "tokio"] }
# MQTT push channel (`mqtt.rs`): MQTT v5 with the platform's root certificates, as paho uses.
# rumqttc-next, the maintained fork of rumqttc (bytebeamio/rumqtt has had no release since
# 0.25.1 and still pins the vulnerable rustls-webpki 0.102). Pinned: bump it deliberately.
rumqttc = { package = "rumqttc-v5-next", version = "=0.34.0", default-features = false, features = ["use-rustls-no-provider"] }
rustls-native-certs = "0.8"
# The test broker (feature `testing`).
bytes = { version = "1", optional = true }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"], optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"], optional = true }

[dev-dependencies]
bytes = "1"
memory-stats = "1"
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }

[lints]
workspace = true

# Benchmark helpers (see `bench/`): the fake server and the TLS test broker as processes of their
# own, and the clients the benchmarks measure.
[[example]]
name = "fake_server"
required-features = ["testing"]

[[example]]
name = "load"

[[example]]
name = "mqtt_idle"
required-features = ["testing"]
