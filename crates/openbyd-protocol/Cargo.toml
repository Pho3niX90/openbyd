[package]
name = "openbyd-protocol"
description = "Signing, envelopes, models and error codes of the BYD overseas app API, with no I/O"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"

[dependencies]
aes = "0.9.4"
chrono = { version = "0.4.45", default-features = false, features = ["alloc"] }
indexmap = { version = "2.14.2", features = ["serde"] }
md-5 = "0.11.0"
openbyd-crypto.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["float_roundtrip"] }
sha1 = "0.11.0"

[lints]
workspace = true
