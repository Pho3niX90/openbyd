[package]
name = "openbyd-py"
description = "Python bindings for openbyd"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]
doc = false

[dependencies]
openbyd-crypto.workspace = true
openbyd-protocol.workspace = true
openbyd-client.workspace = true
serde_json.workspace = true
pyo3 = { version = "0.30", features = ["abi3-py311"] }

[lints.clippy]
all = { level = "warn", priority = -1 }
